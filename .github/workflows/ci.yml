name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    name: Layer Check, Analytical Gates & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Fortran/MPI toolchain for SMS Layer-3 solver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran libopenmpi-dev cmake

      - name: Install OpenImpala-Hub with C++/MPI, optional SMS Fortran & dev dependencies
        env:
          SMS_GITHUB_TOKEN: ${{ secrets.SMS_GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mpi,dev]"
          if [ -n "${SMS_GITHUB_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SMS_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
            pip install --no-deps ".[sms]"
          else
            GIT_TERMINAL_PROMPT=0 pip install --no-deps ".[sms]" || echo "Optional private [sms] extra skipped on unauthenticated runner"
          fi
          playwright install --with-deps chromium

      - name: Enforce BASE Lab Layer 4 import boundaries
        run: python -m basecoat.layers .

      - name: Verify CLI & analytical closed-form sanity gate
        run: |
          openimpala-hub --help
          openimpala-hub presets
          openimpala-hub verify
          openimpala-hub run --preset carbon_felt_compression --mechanics --chemistry nmc811_li_ion

      - name: Run unit, multiphysics, bundle, and E2E test suite
        run: pytest -v

  docker-smoke:
    name: Container Build & /healthz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg SMS_GITHUB_TOKEN="${{ secrets.SMS_GITHUB_TOKEN }}" -t openimpala-hub:ci .

      - name: Start container and verify /healthz + v0.3 multiphysics /api/v1/solve
        run: |
          docker run -d --name hub-smoke -p 7860:7860 openimpala-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/healthz; then
              echo ""
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7860/healthz | jq -e '.status == "ok" and .solver_backend == "cpp-cpu"'
          curl -fsS -X POST http://127.0.0.1:7860/api/v1/solve \
            -H "Content-Type: application/json" \
            -d '{"microstructure": {"source_kind": "carbon_felt", "shape": [20, 20, 20], "voxel_size_um": [1.6, 1.6, 1.6]}, "solve": {"directions": ["z"], "compute_mechanics": true}}' \
            | jq -e '.mechanics.backend != null and .electrochem.limiting_c_rate > 0 and .morphology.percolating_fraction > 0'
          docker rm -f hub-smoke
