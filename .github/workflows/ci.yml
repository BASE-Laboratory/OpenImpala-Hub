name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    name: Layer Check, Analytical Gates & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenImpala-Hub with C++/MPI wheel & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mpi,dev]"
          playwright install --with-deps chromium

      - name: Enforce BASE Lab Layer 4 import boundaries
        run: python -m basecoat.layers .

      - name: Verify CLI & analytical closed-form sanity gate
        run: |
          openimpala-hub --help
          openimpala-hub presets
          openimpala-hub verify

      - name: Run unit, bundle, and API test suite
        run: pytest -v

  docker-smoke:
    name: Container Build & /healthz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t openimpala-hub:ci .

      - name: Start container and verify /healthz + /api/v1/solve
        run: |
          docker run -d --name hub-smoke -p 7860:7860 openimpala-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/healthz; then
              echo ""
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7860/healthz | grep -q '"status": "ok"'
          curl -fsS -X POST http://127.0.0.1:7860/api/v1/solve \
            -H "Content-Type: application/json" \
            -d '{"preset": "teaching_analytical_cube", "shape": [24, 24, 24]}' | grep -q '"porosity": 1.0'
          docker rm -f hub-smoke
